<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Drafted — Concept Plan Generator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  :root {
    --void: #0A0A0B;
    --panel: #131315;
    --panel-raised: #1C1C1F;
    --line: #2A2A2E;
    --paper: #F5F5F0;
    --paper-dim: #C9C9C2;
    --muted: #8A8A92;
    --accent: #3ECF8E;
    --danger: #E05A4E;
    --radius: 14px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);

    /* Legend line colors — match the rules the pipeline enforces on
       uploaded reference plans (see ORIGINAL_PLAN_RULES in
       generate-concept/index.ts). Kept as their own tokens rather than
       reusing --accent/--danger etc. since these must visually match the
       actual plan line colors, independent of the app's own UI palette. */
    --legend-magenta: #E93FA6;
    --legend-yellow: #E8C547;
    --legend-green: #4CAF6D;
    --legend-orange: #E8863A;
    --legend-red: #E3564D;
    --legend-blue: #4C8FE3;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--void);
    color: var(--paper);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  ::selection { background: var(--accent); color: var(--void); }

  a { color: inherit; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  .bg-field {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    background: var(--void);
  }

  .bg-grid {
    position: absolute;
    inset: -10%;
    width: 120%;
    height: 120%;
    background-image:
      linear-gradient(rgba(245,245,240,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(245,245,240,0.035) 1px, transparent 1px);
    background-size: 56px 56px;
    animation: drift 60s linear infinite;
  }

  @keyframes drift {
    from { transform: translate(0, 0); }
    to { transform: translate(-56px, -56px); }
  }

  .bg-glow {
    position: absolute;
    width: 70vmax;
    height: 70vmax;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(62,207,142,0.10) 0%, rgba(62,207,142,0.0) 60%);
    filter: blur(10px);
    top: -20vmax;
    left: -10vmax;
    animation: float1 28s ease-in-out infinite;
  }

  .bg-glow.two {
    background: radial-gradient(circle, rgba(245,245,240,0.06) 0%, rgba(245,245,240,0.0) 60%);
    top: auto;
    bottom: -25vmax;
    right: -15vmax;
    left: auto;
    animation: float2 34s ease-in-out infinite;
  }

  @keyframes float1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(6vmax, 8vmax) scale(1.08); }
  }
  @keyframes float2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-5vmax, -6vmax) scale(1.1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .bg-grid, .bg-glow, .bg-glow.two { animation: none; }
    * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }

  .app {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 32px;
    border-bottom: 1px solid var(--line);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Fraunces', serif;
    font-size: 21px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .brand .mark {
    width: 9px; height: 9px;
    background: var(--accent);
    border-radius: 2px;
    transform: rotate(45deg);
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .user-email {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--muted);
  }

  .btn {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 11px 20px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--paper);
    cursor: pointer;
    transition: all 0.25s var(--ease);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--paper-dim); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .btn-primary {
    background: var(--paper);
    color: var(--void);
    border-color: var(--paper);
  }
  .btn-primary:hover { background: #ffffff; border-color: #ffffff; }

  .btn-ghost {
    border-color: transparent;
    color: var(--muted);
    padding: 8px 12px;
  }
  .btn-ghost:hover { color: var(--paper); border-color: var(--line); }

  .auth-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .auth-card {
    width: 100%;
    max-width: 400px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 40px 36px;
    animation: rise 0.6s var(--ease);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .auth-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 14px;
  }

  .auth-title {
    font-family: 'Fraunces', serif;
    font-size: 30px;
    font-weight: 500;
    line-height: 1.15;
    margin: 0 0 8px;
  }

  .auth-sub {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 28px;
    line-height: 1.5;
  }

  .field { margin-bottom: 16px; }

  .field label {
    display: block;
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 7px;
    font-weight: 500;
  }

  .field input {
    width: 100%;
    background: var(--void);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 12px 14px;
    color: var(--paper);
    font-size: 14.5px;
    font-family: 'Inter', sans-serif;
    transition: border-color 0.2s var(--ease);
  }
  .field input:focus {
    outline: none;
    border-color: var(--paper-dim);
  }
  .field input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .auth-submit { width: 100%; justify-content: center; margin-top: 6px; padding: 13px; }

  .auth-toggle {
    text-align: center;
    margin-top: 22px;
    font-size: 13.5px;
    color: var(--muted);
  }
  .auth-toggle button {
    background: none;
    border: none;
    color: var(--paper);
    text-decoration: underline;
    text-decoration-color: var(--line);
    cursor: pointer;
    font-size: 13.5px;
    font-family: inherit;
    padding: 0;
  }
  .auth-toggle button:hover { text-decoration-color: var(--accent); }

  .auth-error {
    background: rgba(224,90,78,0.1);
    border: 1px solid rgba(224,90,78,0.3);
    color: #F0938A;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 16px;
    line-height: 1.4;
  }

  .auth-success {
    background: rgba(62,207,142,0.1);
    border: 1px solid rgba(62,207,142,0.3);
    color: var(--accent);
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 16px;
    line-height: 1.4;
  }

  main.workspace {
    flex: 1;
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    padding: 48px 32px 80px;
  }

  .workspace-head {
    margin-bottom: 36px;
    animation: rise 0.5s var(--ease);
  }

  .workspace-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }

  .workspace-title {
    font-family: 'Fraunces', serif;
    font-size: 38px;
    font-weight: 500;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }

  .workspace-sub {
    color: var(--muted);
    font-size: 15px;
    max-width: 560px;
    line-height: 1.6;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 28px;
  }

  .panel-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .generator-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    animation: rise 0.6s var(--ease) 0.05s backwards;
  }

  @media (max-width: 880px) {
    .generator-grid { grid-template-columns: 1fr; }
  }

  .dropzone {
    border: 1.5px dashed var(--line);
    border-radius: 11px;
    padding: 30px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s var(--ease);
    position: relative;
  }
  .dropzone:hover, .dropzone.drag-over {
    border-color: var(--accent);
    background: rgba(62,207,142,0.04);
  }
  .dropzone input { display: none; }

  .dropzone-icon {
    width: 36px; height: 36px;
    margin: 0 auto 14px;
    opacity: 0.7;
  }

  .dropzone-text { font-size: 14px; color: var(--paper); margin-bottom: 4px; }
  .dropzone-hint { font-size: 12.5px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }

  .file-pin {
    margin-top: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--panel-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    animation: rise 0.35s var(--ease);
    position: relative;
  }

  .file-pin .thumb {
    width: 42px; height: 42px;
    border-radius: 6px;
    background: var(--void);
    object-fit: cover;
    border: 1px solid var(--line);
    flex-shrink: 0;
  }

  .file-pin .meta { flex: 1; min-width: 0; }
  .file-pin .meta .name {
    font-size: 13.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .file-pin .meta .kind {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    margin-top: 2px;
  }

  .file-pin .remove {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 4px;
    flex-shrink: 0;
    transition: color 0.2s;
  }
  .file-pin .remove:hover { color: var(--danger); }

  textarea.prompt-box {
    width: 100%;
    min-height: 132px;
    background: var(--void);
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 16px;
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    line-height: 1.6;
    resize: vertical;
    transition: border-color 0.2s var(--ease);
  }
  textarea.prompt-box:focus {
    outline: none;
    border-color: var(--paper-dim);
  }
  textarea.prompt-box::placeholder { color: var(--muted); }

  .generate-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 20px;
    gap: 16px;
  }

  .parking-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 14px;
  }
  
  .parking-label {
    font-size: 12.5px;
    color: var(--muted);
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  
  .optional-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0.7;
  }
  
  .parking-input {
    width: 90px;
    background: var(--void);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 9px 10px;
    color: var(--paper);
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    text-align: right;
    transition: border-color 0.2s var(--ease);
  }
  .parking-input:focus {
    outline: none;
    border-color: var(--paper-dim);
  }
  .parking-input::placeholder { color: var(--muted); }
  
  .char-hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--muted);
  }

  /* ============================================================
     PLAN LEGEND — collapsible reference showing what each line
     color/style on an uploaded plan means to the generator.
     Sits inside the "Reference (optional)" panel, under the
     dropzone/file-pin.
     ============================================================ */

  .legend {
    margin-top: 16px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: var(--panel-raised);
    overflow: hidden;
  }

  .legend-toggle {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 14px;
    background: none;
    border: none;
    color: var(--paper-dim);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: color 0.2s var(--ease);
  }
  .legend-toggle:hover { color: var(--paper); }

  .legend-toggle-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .legend-toggle-icon { width: 15px; height: 15px; flex-shrink: 0; }

  .legend-chevron {
    width: 15px; height: 15px;
    flex-shrink: 0;
    transition: transform 0.25s var(--ease);
  }
  .legend.open .legend-chevron { transform: rotate(180deg); }

  .legend-body {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.25s var(--ease);
  }
  .legend.open .legend-body { grid-template-rows: 1fr; }

  .legend-body > * { overflow: hidden; }

  .legend-hint {
    padding: 0 14px 10px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }

  .legend-grid {
    display: flex;
    flex-direction: column;
    padding: 0 14px 14px;
  }

  .legend-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 8px 0;
    border-top: 1px solid var(--line);
  }
  .legend-row:first-child { border-top: none; }

  .legend-swatch {
    flex-shrink: 0;
    width: 34px;
    height: 0;
    margin-top: 9px;
    border-top-width: 3px;
    border-top-style: solid;
  }
  .legend-swatch.thin { border-top-width: 1.5px; }
  .legend-swatch.thick { border-top-width: 3px; }
  .legend-swatch.dashed { border-top-style: dashed; }
  .legend-swatch.solid { border-top-style: solid; }

  .legend-swatch.magenta { border-top-color: var(--legend-magenta); }
  .legend-swatch.yellow  { border-top-color: var(--legend-yellow); }
  .legend-swatch.green   { border-top-color: var(--legend-green); }
  .legend-swatch.orange  { border-top-color: var(--legend-orange); }
  .legend-swatch.red     { border-top-color: var(--legend-red); }
  .legend-swatch.blue    { border-top-color: var(--legend-blue); }

  .legend-swatch.shaded {
    height: 8px;
    margin-top: 5px;
    background: rgba(76,175,109,0.18);
  }

  .legend-text { min-width: 0; }

  .legend-label {
    font-size: 13px;
    color: var(--paper);
    font-weight: 500;
    margin-bottom: 2px;
  }

  .legend-desc {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }

  .status-strip {
    margin-top: 28px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    background: var(--panel-raised);
    border: 1px solid var(--line);
    border-radius: 11px;
    animation: rise 0.4s var(--ease);
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(62,207,142,0.5); }
    50% { opacity: 0.6; box-shadow: 0 0 0 6px rgba(62,207,142,0); }
  }

  .status-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--accent);
  }

  .status-text { font-size: 13.5px; color: var(--muted); }

  .status-strip.failed .status-dot { background: var(--danger); animation: none; }
  .status-strip.failed .status-tag { color: var(--danger); }

  .result-panel {
    margin-top: 40px;
    animation: unfold 0.7s var(--ease);
    transform-origin: top;
  }

  @keyframes unfold {
    from { opacity: 0; transform: scaleY(0.96) translateY(-8px); }
    to { opacity: 1; transform: scaleY(1) translateY(0); }
  }

  .result-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .result-title {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 500;
  }

  .result-frame {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--panel);
  }

  .result-frame img {
    width: 100%;
    display: block;
    background: var(--void);
  }

  .result-actions {
    display: flex;
    gap: 12px;
    padding: 18px;
    border-top: 1px solid var(--line);
    flex-wrap: wrap;
  }

  .history-section { margin-top: 56px; }

  .history-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .history-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }

  /* ============================================================
   FOLDERS + CARD MENU — paste into index.html's <style> block.
   Also add `position: relative;` to the existing .history-card rule.
   Also remove `margin-top: 56px;` from the existing .history-section
   rule (the margin moves to .library-layout below instead).
   ============================================================ */

  .library-layout {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 24px;
    margin-top: 56px;
  }
  @media (max-width: 880px) {
    .library-layout { grid-template-columns: 1fr; }
  }
  
  .folder-sidebar {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    align-self: start;
  }
  
  .folder-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-bottom: 14px;
  }
  
  .folder-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 9px 10px;
    border-radius: 8px;
    font-size: 13.5px;
    cursor: pointer;
    transition: background 0.2s var(--ease), border-color 0.2s var(--ease);
    border: 1px solid transparent;
    color: var(--paper-dim);
  }
  .folder-item:hover { background: var(--panel-raised); color: var(--paper); }
  .folder-item.active { background: var(--panel-raised); color: var(--paper); border-color: var(--line); }
  .folder-item.drag-over { border-color: var(--accent); background: rgba(62,207,142,0.08); }
  
  .folder-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  
  .folder-actions {
    display: flex;
    gap: 2px;
    opacity: 0;
    transition: opacity 0.2s;
    flex-shrink: 0;
  }
  .folder-item:hover .folder-actions { opacity: 1; }
  
  .icon-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    padding: 3px 5px;
    border-radius: 5px;
    line-height: 1;
  }
  .icon-btn:hover { color: var(--paper); background: var(--void); }
  
  .folder-item.renaming { padding: 4px; }
  
  .folder-rename-input {
